# Evaluation set: questions about the FastAPI tutorial (v0.165.0), English and Japanese.
#
# Scoring is deterministic, done in code, not by an LLM judge:
#   pages:   the answer's evidence must come from one of these pages (either language edition).
#   facts:   every group must appear in the answer; each group lists accepted alternatives.
#   abstain: the tutorial does not cover this; the agent should say so instead of inventing.

