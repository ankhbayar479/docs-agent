# Harder questions: several details from different sections, or two different pages.
# Same deterministic scoring as questions.yaml. `pages_all: true` means every listed page
# must be found (either language edition), not just one of them.

- id: hard-jwt
  lang: en
  question: In the JWT tutorial, which library hashes the passwords, which algorithm signs the tokens, and how long do access tokens last by default?
  pages: [tutorial/security/oauth2-jwt]
  facts: [[pwdlib], [HS256], ["30"]]

- id: hard-jwt-ja
  lang: ja
  question: JWTのチュートリアルで、パスワードのハッシュに使うライブラリ、トークンの署名アルゴリズム、アクセストークンのデフォルトの有効期限はそれぞれ何ですか？
  pages: [tutorial/security/oauth2-jwt]
  facts: [[pwdlib], [HS256], ["30"]]

- id: hard-router-201
  lang: en
  question: I'm splitting my app into routers. When I include one router, how do I require a token-header dependency for all of its routes, and how do I make its POST route return 201?
  pages: [tutorial/bigger-applications, tutorial/response-status-code]
  pages_all: true
  facts: [[include_router], [dependencies], [status_code], ["201"]]

